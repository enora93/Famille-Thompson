<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Famille Thompson</title>
<meta name="theme-color" content="#0A0A0A">
<style>
body{font-family:sans-serif;background:#0A0A0A;color:white;text-align:center;margin:0;padding:15px}
.card{background:#1A1A1A;padding:18px;border-radius:24px;max-width:420px;margin:12px auto;border:1px solid #2A2A2A}
input{padding:14px;border-radius:15px;border:2px solid #333;background:#222;color:white;width:85%;margin:6px;font-size:16px}
button{border:0;padding:12px 16px;border-radius:30px;font-size:15px;margin:5px;cursor:pointer;font-weight:bold}
.btn-add{background:white;color:black;width:90%}
.membre{padding:12px 16px;border-radius:18px;margin:8px;display:flex;align-items:center;gap:12px;background:#222;border-left:6px solid var(--c)}
.rond{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;flex-shrink:0}
.boussole{width:260px;height:260px;border-radius:50%;border:3px solid #333;background:radial-gradient(circle,#222 0%,#111 70%);margin:15px auto;position:relative}
.aiguille{position:absolute;left:50%;top:50%;width:0;height:0;transition:transform .2s}
.aiguille:before{content:'';position:absolute;left:-14px;top:-105px;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:105px solid #FF3B30}
.aiguille:after{content:'';position:absolute;left:-14px;top:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:105px solid white}
.point{position:absolute;font-weight:bold;font-size:20px}.n{top:8px;left:50%;transform:translateX(-50%);color:#FF3B30}.s{bottom:8px;left:50%;transform:translateX(-50%)}.e{right:12px;top:50%;transform:translateY(-50%)}.o{left:12px;top:50%;transform:translateY(-50%)}
.centre{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;background:white;border-radius:50%;border:4px solid #111;z-index:2}
</style></head>
<body>
<h1>✦ FAMILLE THOMPSON ✦</h1>
<p style="color:#AAA" id="status">Pour commencer, active le GPS</p>

<div class="card">
<h3>➕ Ajouter quelqu'un</h3>
<input id="nom" placeholder="Prénom : ex: Léa">
<br><label style="color:#AAA">Sa couleur :</label><br>
<input type="color" id="couleur" value="#FFFFFF" style="width:70px;height:45px;background:none;border:none">
<br><button class="btn-add" onclick="ajouter()">Ajouter à ma famille</button>
</div>

<div class="card"><h3>Ma Famille</h3><div id="liste"></div>
<p style="color:#AAA;font-size:13px">Astuce : Sur le téléphone de Maman, clique sur "Je suis ici" pour enregistrer sa position, puis sur ton téléphone clique sur "Chercher".</p></div>

<div class="card">
<h3 id="cherche">Choisis quelqu'un...</h3>
<div class="boussole"><span class="point n">N</span><span class="point s">S</span><span class="point e">E</span><span class="point o">O</span><div class="aiguille" id="aiguille"></div><div class="centre"></div></div>
<h2 id="distance" style="color:#FFD700">-- m</h2>
<p id="info" style="color:#AAA">Tourne-toi, suis la pointe rouge !</p>
<button style="background:white;color:black;width:90%" onclick="activer()">📍 1. ACTIVER LE GPS + BOUSSOLE</button>
</div>

<script>
let famille=JSON.parse(localStorage.getItem('famille2')||'[]');
if(famille.length==0){famille=[{nom:'Maman',couleur:'#FF2E7E',lat:null,lng:null},{nom:'Papa',couleur:'#2E86FF',lat:null,lng:null}]; sauver();}
let maLat=null, maLng=null, capCible=0, heading=0, cible=null;
function sauver(){localStorage.setItem('famille2',JSON.stringify(famille)); afficher();}
function ajouter(){let n=document.getElementById('nom').value.trim(); if(!n) return alert('Écris un prénom !'); famille.push({nom:n,couleur:document.getElementById('couleur').value,lat:null,lng:null}); document.getElementById('nom').value=''; sauver();}
function afficher(){
  document.getElementById('liste').innerHTML=famille.map((m,i)=>{
    let txt=(m.couleur.toLowerCase()=='#ffffff')?'black':'white';
    let pos=m.lat?`📍 ${Math.round(m.dist||0)}m`:'Pas de position';
    return <div class="membre" style="--c:${m.couleur}"><div class="rond" style="background:${m.couleur};color:${txt}">${m.nom[0].toUpperCase()}</div><div style="flex:1;text-align:left"><b>${m.nom}</b><br><small style="color:#AAA">${pos}</small></div><button style="background:#333;color:white" onclick="jeSuisIci(${i})">Je suis ici</button><button style="background:${m.couleur};color:${txt}" onclick="chercher(${i})">Chercher</button><button onclick="supp(${i})" style="background:#333;color:white">✕</button></div>
  }).join('');
}
function supp(i){famille.splice(i,1); sauver();}
function jeSuisIci(i){
  if(maLat==null) return alert('Active le GPS en bas d\'abord !');
  famille[i].lat=maLat; famille[i].lng=maLng; sauver(); alert(famille[i].nom+' enregistré ICI !');
}
function chercher(i){
  cible=famille[i]; document.getElementById('cherche').innerText='On cherche '+cible.nom+'...';
  if(!cible.lat) {document.getElementById('info').innerText='Cette personne n\'a pas encore cliqué "Je suis ici"'; return;}
  maj();
}
function calculer(lat1,lng1,lat2,lng2){
  let r=Math.PI/180; let dLat=(lat2-lat1)*r, dLng=(lng2-lng1)*r;
  let a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLng/2)**2;
  let dist=6371000*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  let y=Math.sin(dLng)*Math.cos(lat2*r); let x=Math.cos(lat1*r)*Math.sin(lat2*r)-Math.sin(lat1*r)*Math.cos(lat2*r)*Math.cos(dLng);
  let cap=(Math.atan2(y,x)*180/Math.PI+360)%360;
  return {dist,cap};
}
function maj(){
  if(!cible||!cible.lat||maLat==null) return;
  let r=calculer(maLat,maLng,cible.lat,cible.lng);
  cible.dist=r.dist; capCible=r.cap;
  document.getElementById('distance').innerText=Math.round(r.dist)+' m - '+ (r.dist<20?'TU ES TOUT PRÈS ! 🎉':'Marche vers la flèche');
  document.getElementById('info').innerText='Direction : '+Math.round(r.cap)+'°';
  let rotation=capCible-heading;
  document.getElementById('aiguille').style.transform=`translate(-50%,-50%) rotate(${rotation}deg)`;
  afficher();
}
async function activer(){
  // Demande permission boussole sur iPhone
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    try{ await DeviceOrientationEvent.requestPermission(); }catch(e){}
  }
  if(!navigator.geolocation) return alert('Pas de GPS');
  document.getElementById('status').innerText='GPS activé... marche un peu pour que ça calcule !';
  navigator.geolocation.watchPosition(p=>{
    maLat=p.coords.latitude; maLng=p.coords.longitude;
    document.getElementById('status').innerText='✅ GPS OK - Tu es à '+maLat.toFixed(4)+', '+maLng.toFixed(4);
    maj();
  },e=>alert('Autorise la position !'),{enableHighAccuracy:true});
  alert('Boussole activée ! Tourne ton téléphone, la flèche doit bouger !');
}
window.addEventListener('deviceorientation',e=>{
  if(e.webkitCompassHeading!=null) heading=e.webkitCompassHeading;
  else if(e.alpha!=null) heading=360-e.alpha;
  maj();
});
afficher();
</script></body></html>
