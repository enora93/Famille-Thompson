<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Famille Thompson</title>
<style>
body{background:#0A0A0A;color:white;text-align:center;font-family:sans-serif;margin:0;padding:15px}
.card{background:#1A1A1A;padding:18px;border-radius:24px;max-width:420px;margin:12px auto;border:1px solid #2A2A2A}
input{padding:14px;border-radius:15px;border:2px solid #333;background:#222;color:white;width:85%;margin:6px;font-size:16px}
button{border:0;padding:12px 16px;border-radius:30px;font-size:15px;margin:5px;cursor:pointer;font-weight:bold}
.btn-add{background:white;color:black;width:90%}
.membre{padding:12px;border-radius:18px;margin:8px;display:flex;align-items:center;gap:10px;background:#222}
.rond{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;flex-shrink:0}
.boussole{width:260px;height:260px;border-radius:50%;border:3px solid #333;background:#111;margin:15px auto;position:relative}
.aiguille{position:absolute;left:50%;top:50%;width:0;height:0}
.aiguille:before{content:'';position:absolute;left:-14px;top:-105px;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:105px solid #FF3B30}
.aiguille:after{content:'';position:absolute;left:-14px;top:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:105px solid white}
.point{position:absolute;font-weight:bold;font-size:20px}.n{top:8px;left:50%;color:#FF3B30}.s{bottom:8px;left:50%}.e{right:12px;top:50%}.o{left:12px;top:50%}
.centre{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;background:white;border-radius:50%;border:4px solid #111;z-index:2}
.codebox{background:#000;border:2px dashed #FFD700;padding:15px;border-radius:15px;font-size:22px;word-break:break-all;margin:10px}
</style></head>
<body>
<h1>✦ FAMILLE THOMPSON ✦</h1>
<p id="status" style="color:#AAA">Clique sur ACTIVER LE GPS en bas</p>

<div class="card">
<h3>Ajouter quelqu'un</h3>
<input id="nom" placeholder="Prenom : ex: Marc">
<br><label style="color:#AAA">Sa couleur :</label><br>
<input type="color" id="couleur" value="#FFFFFF" style="width:70px;height:45px;background:none;border:none">
<br><button class="btn-add" onclick="ajouter()">Ajouter a ma famille</button>
</div>

<div class="card">
<h3>🔑 Entrer le CODE de quelqu'un</h3>
<p style="color:#AAA;font-size:13px">Marc te donne son code ? Colle-le ici !</p>
<input id="codeEntree" placeholder="Colle le code ici">
<br><button style="background:#FFD700;color:black;width:90%" onclick="entrerCode()">Valider le CODE</button>
<div id="monCodeAffiche"></div>
</div>

<div class="card"><h3>Ma Famille</h3><div id="liste"></div></div>

<div class="card">
<h3 id="cherche">Choisis quelqu'un...</h3>
<div class="boussole"><span class="point n">N</span><span class="point s">S</span><span class="point e">E</span><span class="point o">O</span><div class="aiguille" id="aiguille"></div><div class="centre"></div></div>
<h2 id="distance" style="color:#FFD700">-- m</h2>
<p id="info" style="color:#AAA">Tourne-toi, suis la pointe rouge !</p>
<button style="background:white;color:black;width:90%" onclick="activer()">1. ACTIVER LE GPS + BOUSSOLE</button>
</div>

<script>
var famille = [];
try { famille = JSON.parse(localStorage.getItem('famille3') || '[]'); } catch(e){ famille = []; }
if(famille.length==0){ famille = [{nom:'Maman',couleur:'#FF2E7E',lat:null,lng:null},{nom:'Papa',couleur:'#2E86FF',lat:null,lng:null}]; sauver(); }
var maLat=null, maLng=null, heading=0, cibleIndex=-1;
function sauver(){ localStorage.setItem('famille3', JSON.stringify(famille)); afficher(); }
function ajouter(){
  var n = document.getElementById('nom').value;
  if(!n){ alert('Ecris un prenom !'); return; }
  var c = document.getElementById('couleur').value;
  famille.push({nom:n, couleur:c, lat:null, lng:null});
  document.getElementById('nom').value = '';
  sauver(); alert(n + ' ajoute ! 🎉');
}
function afficher(){
  var html = '';
  for(var i=0; i<famille.length; i++){
    var m = famille[i];
    var txt = 'white'; if(m.couleur.toLowerCase() == '#ffffff'){ txt = 'black'; }
    var pos = 'Pas de position'; if(m.lat){ pos = 'Position recue !'; }
    html += '<div class="membre"><div class="rond" style="background:'+m.couleur+';color:'+txt+'">'+m.nom.charAt(0).toUpperCase()+'</div><div style="flex:1;text-align:left"><b>'+m.nom+'</b><br><small style="color:#AAA">'+pos+'</small></div><button style="background:#FFD700;color:black" onclick="jeSuisIci('+i+')">Mon CODE</button><button style="background:'+m.couleur+';color:'+txt+'" onclick="chercher('+i+')">Chercher</button><button onclick="supp('+i+')" style="background:#333;color:white">X</button></div>';
  }
  document.getElementById('liste').innerHTML = html;
}
function supp(i){ famille.splice(i,1); sauver(); }
function jeSuisIci(i){
  if(maLat==null){ alert('Active le GPS en bas d\'abord !'); return; }
  famille[i].lat = maLat; famille[i].lng = maLng; sauver();
  var code = famille[i].nom + '|' + maLat.toFixed(5) + '|' + maLng.toFixed(5);
  document.getElementById('monCodeAffiche').innerHTML = '<p style="color:#FFD700">TON CODE A ENVOYER A TA FAMILLE :</p><div class="codebox">' + code + '</div><p style="color:#AAA;font-size:13px">Envoie ce code par SMS a ta famille, ils le collent dans "Entrer le CODE"</p><button style="background:white;color:black" onclick="copierCode(\''+code+'\')">Copier le code</button>';
  alert('Ton CODE est affiche en haut ! Envoie-le !');
}
function copierCode(c){
  var temp = document.createElement('textarea'); temp.value = c; document.body.appendChild(temp); temp.select(); document.execCommand('copy'); document.body.removeChild(temp);
  alert('Code copie ! Colle-le dans ton SMS !');
}
function entrerCode(){
  var code = document.getElementById('codeEntree').value;
  if(!code || code.indexOf('|')==-1){ alert('Ce code ne marche pas, copie bien tout le code !'); return; }
  var parts = code.split('|');
  var nomPos = parts[0]; var latPos = parseFloat(parts[1]); var lngPos = parseFloat(parts[2]);
  var trouve = false;
  for(var k=0;k<famille.length;k++){ if(famille[k].nom.toLowerCase()==nomPos.toLowerCase()){ famille[k].lat=latPos; famille[k].lng=lngPos; trouve=true; } }
  if(!trouve){ famille.push({nom:nomPos, couleur:'#FFFFFF', lat:latPos, lng:lngPos}); }
  sauver();
  document.getElementById('codeEntree').value = '';
  alert(nomPos + ' trouve ! Clique sur Chercher ' + nomPos + ' !');
}
function chercher(i){ cibleIndex = i; var c = famille[i]; document.getElementById('cherche').innerText = 'On cherche ' + c.nom + '...'; if(!c.lat){ document.getElementById('info').innerText = c.nom + ' doit cliquer "Mon CODE" et t\'envoyer son code !'; return; } maj(); }
function maj(){
  if(cibleIndex < 0) return; var c = famille[cibleIndex]; if(!c.lat || maLat==null) return;
  var r = Math.PI/180; var dLat = (c.lat - maLat) * r; var dLng = (c.lng - maLng) * r;
  var a = Math.pow(Math.sin(dLat/2),2) + Math.cos(maLat*r) * Math.cos(c.lat*r) * Math.pow(Math.sin(dLng/2),2);
  var dist = 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  var y = Math.sin(dLng) * Math.cos(c.lat*r); var x = Math.cos(maLat*r) * Math.sin(c.lat*r) - Math.sin(maLat*r) * Math.cos(c.lat*r) * Math.cos(dLng);
  var cap = (Math.atan2(y,x) * 180 / Math.PI + 360) % 360; var rot = cap - heading;
  document.getElementById('distance').innerText = Math.round(dist) + ' m';
  if(dist < 20){ document.getElementById('info').innerText = 'TU ES TOUT PRES ! 🎉'; } else { document.getElementById('info').innerText = 'Marche vers la pointe ROUGE !'; }
  document.getElementById('aiguille').style.transform = 'translate(-50%,-50%) rotate(' + rot + 'deg)';
}
function activer(){
  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){ DeviceOrientationEvent.requestPermission().catch(function(){}); }
  if(!navigator.geolocation){ alert('Pas de GPS'); return; }
  navigator.geolocation.watchPosition(function(p){ maLat = p.coords.latitude; maLng = p.coords.longitude; document.getElementById('status').innerText = 'GPS OK ✅'; maj(); }, function(e){ alert('Autorise la position ! ' + e.message); }, {enableHighAccuracy:true});
  alert('GPS demande ! Dis Autoriser !');
}
window.addEventListener('deviceorientation', function(e){ if(e.webkitCompassHeading != null){ heading = e.webkitCompassHeading; } else if(e.alpha != null){ heading = 360 - e.alpha; } maj(); });
afficher();
</script></body></html>
