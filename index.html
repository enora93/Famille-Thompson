<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#0A0A0A;color:white;text-align:center;font-family:sans-serif;padding:30px}button{padding:20px 30px;font-size:20px;border-radius:30px;border:0;margin:10px;background:white;color:black;font-weight:bold}input{padding:15px;border-radius:15px;font-size:18px;width:80%}</style></head>
<body>
<h1>TEST CLIC</h1>
<p id="resultat">Clique sur un bouton...</p>
<input id="nom" placeholder="Écris Marc">
<br><br>
<button onclick="test1()">TEST 1 - CLIC</button>
<br>
<button onclick="test2()">TEST 2 - AJOUTER</button>
<br>
<button onclick="test3()">TEST 3 - GPS</button>
<script>
function test1(){ document.getElementById('resultat').innerText = 'TEST 1 MARCHE ! 🎉'; alert('Le clic marche !'); }
function test2(){
  var n = document.getElementById('nom').value;
  if(!n){ alert('Écris un prénom d\'abord'); return; }
  document.getElementById('resultat').innerText = 'Bonjour ' + n + ' ! Ajout marche !';
  alert('Ajout marche pour ' + n);
}
function test3(){
  document.getElementById('resultat').innerText = 'Je cherche le GPS...';
  if(!navigator.geolocation){ alert('Pas de GPS sur ce téléphone'); return; }
  navigator.geolocation.getCurrentPosition(function(p){
    alert('GPS MARCHE ! Tu es à ' + p.coords.latitude + ' , ' + p.coords.longitude);
    document.getElementById('resultat').innerText = 'GPS MARCHE ! ' + p.coords.latitude;
  }, function(e){ alert('GPS bloqué : ' + e.message + ' Va dans Réglages et autorise la position'); });
}
</script></body></html>
